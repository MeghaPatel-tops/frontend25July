<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      
        .black{
            padding: 50px;
            background-color: black;
            border: 1px solid white;

        }
        .white{
             padding: 50px;
            background-color: gray;
            border: 1px solid white;
        }

    
    </style>
    <script>
            function chessGen(){
                let str="";
                
                for(i=1;i<=8;i++){
                    str+="<div>"
                    for(j=1;j<=8;j++){
                        if((j+i) % 2==0){
                            str+=`<span class="black">${i}</span>`
                        }
                        else{
                            str+=`<span class="white">${i}</span>`
                        }
                    }
                    str+="</div>";
                }
                console.log(str);
                
                document.getElementById('main').innerHTML=str;
            }
    </script>
</head>
<body>
    <button onclick="chessGen()">Click here </button>
    <div id="main"></div>
    
</body>
</html>
