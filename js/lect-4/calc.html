<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Simple calc</legend>
        <label for="">Enter num1</label>
        <input type="text" name="" id="num1">
        <br><br>
          <label for="">Enter num2</label>
        <input type="text" name="" id="num2">
        <br><br>
        <button onclick="cal('+')">+</button>
        <button onclick="cal('-')">-</button>
        <button onclick="cal('*')">*</button>
        <button onclick="cal('/')">/</button>
        <p id="result"></p>
    </fieldset>

    <script>
        function cal(op){
            let num1 = +document.getElementById('num1').value;
            let num2 = +document.getElementById('num2').value;
            let str;
            switch(op){
                case '+':
                    str=`Add=${num1+num2}`
                break; 
                case '-':
                    str=`Sub=${num1-num2}`
                break; 
                case '*':
                    str=`Mul=${num1*num2}`
                break; 
                case '/':
                    str=`Div=${num1/num2}`
                break; 
                default:  
                alert("Wrong choice");

            }
            document.getElementById('result').innerHTML=str;
        }
    </script>
</body>
</html>
