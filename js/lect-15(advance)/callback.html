<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    

    <script>
        function getData(cb){
            setTimeout(()=>{
                console.log("time consuming process");
                cb();
            },2000)

        }
        function printData(){
            console.log("print data function called");
            
        }
        getData(printData);
       
    </script>
