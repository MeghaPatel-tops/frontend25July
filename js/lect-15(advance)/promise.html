<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        const myPromise = new Promise((resolve,reject)=>{
             let num=11;
             if(num%2==0){
                resolve();
             }
             else{
                reject();
             }
        })

        myPromise
        .then(()=>console.log("promise Done"))
        .catch(()=>console.log("Promises rejected"));
    </script>
</body>
</html>
